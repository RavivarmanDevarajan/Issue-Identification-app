version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: issue-identification-app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_PATH=/app/data/database.db
      - NODE_ENV=production
    volumes:
      - sqlite_data:/app/data
    restart: unless-stopped

volumes:
  sqlite_data:
    driver: local
    name: issue_app_sqlite_data
